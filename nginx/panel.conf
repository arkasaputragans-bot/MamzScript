# Panel VPN - nginx
# :8080 = fallback website (tujuan fallback xray edge & haproxy)
# :81    = hosting file config akun (.txt) untuk link "Save Account"

# Map buat WebSocket: kirim "upgrade" hanya kalau klien minta upgrade,
# kalau request biasa kirim "close" biar response non-101 (mis. 400) balik normal.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 127.0.0.1:8080 default_server;
    server_name _;
    port_in_redirect off;
    root /var/www/html;
    index index.html;
    location / {
        try_files $uri $uri/ =404;
    }
}

server {
    listen 81 default_server;
    server_name _;
    port_in_redirect off;
    root /var/www/html;
    # file akun: /vmess-<user>.txt dsb.
    location / {
        try_files $uri =404;
    }
}

# Multi Path zero-config (port 443 via fallback xray-edge).
# /<bebas>/<proto> -> rewrite ke canonical -> proxy ke xray inner.
# Contoh: /whatever/vmess, /abc123/vless — tanpa perlu didaftarkan.
# Yang tidak cocok pola -> website fallback (perilaku lama).
server {
    listen 127.0.0.1:10009;
    server_name _;
    port_in_redirect off;

    location ~ ^/[^/]+/vmess(/.*)?$ {
        rewrite ^ /vmess break;
        proxy_pass http://127.0.0.1:10001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
    }
    location ~ ^/[^/]+/vless(/.*)?$ {
        rewrite ^ /vless break;
        proxy_pass http://127.0.0.1:10003;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
    }
    location ~ ^/[^/]+/trojan(/.*)?$ {
        rewrite ^ /trojan break;
        proxy_pass http://127.0.0.1:10005;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
    }
    location ~ ^/[^/]+/(ss-ws|shadowsocks)(/.*)?$ {
        rewrite ^ /ss-ws break;
        proxy_pass http://127.0.0.1:10007;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
    }
    location ~ ^/[^/]+/(ssh-ws|ssh)(/.*)?$ {
        rewrite ^ /ssh-ws break;
        proxy_pass http://127.0.0.1:10020;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
    }
    # Alias FighterTunnel (migrasi): /fightertunnelssh -> ws.py
    location = /fightertunnelssh {
        proxy_pass http://127.0.0.1:10020;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
    }
    # SSH-WS canonical (dari fallback Xray edge) -> ws.py
    location = /ssh-ws {
        proxy_pass http://127.0.0.1:10020;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
    }
    # Catch-all 443: prioritaskan WS. ws.py yang menilai apakah ini request
    # WS valid (dia handle pipelining bug-host); bukan WS -> 400 dari ws.py.
    # Website fallback tetap ada di :8080 untuk akses langsung.
    location / {
        proxy_pass http://127.0.0.1:10020;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
    }
}

global
    maxconn 50000
    tune.bufsize 10485760
    daemon

defaults
    log global
    mode tcp
    option dontlognull
    timeout connect 5s
    timeout client 24h
    timeout server 24h

# ---- Port 443: TLS passthrough ke Xray edge (fallbacks di xray) ----
frontend tls_in
    bind *:443 tfo
    mode tcp
    tcp-request inspect-delay 10s
    tcp-request content accept if { req.ssl_hello_type 1 }
    default_backend xray_edge

backend xray_edge
    mode tcp
    server edge 127.0.0.1:10000 check

# ---- Port 80: HTTP routing by path ----
frontend http_in
    bind *:80 tfo
    mode http
    option httplog
    # Multi Path zero-config: /<bebas>/<proto> -> tulis ulang ke canonical.
    # Contoh: /whatever/vmess, /abc123/vless — tanpa perlu didaftarkan.
    acl mp_vmess path_reg ^/[^/]+/vmess(/.*)?$
    acl mp_vless path_reg ^/[^/]+/vless(/.*)?$
    acl mp_trojan path_reg ^/[^/]+/trojan(/.*)?$
    acl mp_ss path_reg ^/[^/]+/(ss-ws|shadowsocks)(/.*)?$
    acl mp_ssh path_reg ^/[^/]+/(ssh-ws|ssh)(/.*)?$
    http-request set-path /vmess if mp_vmess
    http-request set-path /vless if mp_vless
    http-request set-path /trojan if mp_trojan
    http-request set-path /ss-ws if mp_ss
    http-request set-path /ssh-ws if mp_ssh
    acl p_vmess path_beg /vmess
    acl p_vless path_beg /vless
    acl p_trojan path_beg /trojan
    acl p_ss path_beg /ss-ws
    acl p_sshws path_beg /ssh-ws
    acl p_sshws_ft path_beg /fightertunnelssh
    acl p_panel path_beg /panel/
    acl p_api path_beg /api/
    use_backend be_vmess if p_vmess
    use_backend be_vless if p_vless
    use_backend be_trojan if p_trojan
    use_backend be_ss if p_ss
    use_backend be_sshws if p_sshws
    use_backend be_sshws if p_sshws_ft
    use_backend be_nginx if p_panel
    use_backend be_panelapi if p_api
    default_backend be_nginx

backend be_vmess
    mode http
    server vmess 127.0.0.1:10001 check

backend be_vless
    mode http
    server vless 127.0.0.1:10003 check

backend be_trojan
    mode http
    server trojan 127.0.0.1:10005 check

backend be_ss
    mode http
    server ss 127.0.0.1:10007 check

backend be_sshws
    mode http
    server sshws 127.0.0.1:10020 check

backend be_nginx
    mode http
    server nginx 127.0.0.1:8080 check

backend be_panelapi
    mode http
    http-request set-path %[path,regsub(^/api/,/,)]
    server api 127.0.0.1:5888 check

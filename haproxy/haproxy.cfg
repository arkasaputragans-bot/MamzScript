global
    maxconn 50000
    tune.bufsize 10485760
    daemon

defaults
    log global
    mode tcp
    option dontlognull
    timeout connect 5s
    timeout client 24h
    timeout server 24h

# ---- Port 443: TLS passthrough ke Xray edge (fallbacks di xray) ----
frontend tls_in
    bind *:443 tfo
    mode tcp
    tcp-request inspect-delay 10s
    tcp-request content accept if { req.ssl_hello_type 1 }
    default_backend xray_edge

backend xray_edge
    mode tcp
    server edge 127.0.0.1:10000 check

# ---- Port 80: TCP mode ala FighterTunnel (teruskan mentah, tanpa validasi HTTP) ----
# Alasan: payload bug-host via proxy eksternal sering cacat (typo, pipelining);
# mode http menolaknya (400/502). Mode tcp + content inspection meneruskan
# semuanya, backend yang parsing.
frontend http_in
    bind *:80 tfo
    mode tcp
    tcp-request inspect-delay 500ms
    tcp-request content accept
    # Path-based routing (bekerja via content inspection, tanpa validasi HTTP)
    acl p_vmess path_beg /vmess
    acl p_vless path_beg /vless
    acl p_trojan path_beg /trojan
    acl p_ss path_beg /ss-ws
    acl p_sshws path_beg /ssh-ws
    acl p_sshws_ft path_beg /fightertunnelssh
    acl p_root path -i /
    acl p_panel path_beg /panel/
    acl p_api path_beg /api/
    # Upgrade header (terdeteksi di buffer pipelining juga)
    acl ws_upgrade hdr(Upgrade) -i websocket
    use_backend be_vmess if p_vmess
    use_backend be_vless if p_vless
    use_backend be_trojan if p_trojan
    use_backend be_ss if p_ss
    use_backend be_sshws if ws_upgrade
    use_backend be_sshws if p_sshws
    use_backend be_sshws if p_sshws_ft
    use_backend be_sshws if p_root
    use_backend be_nginx if p_panel
    use_backend be_nginx if p_api
    default_backend be_nginx

backend be_vmess
    mode tcp
    server vmess 127.0.0.1:10001 check

backend be_vless
    mode tcp
    server vless 127.0.0.1:10003 check

backend be_trojan
    mode tcp
    server trojan 127.0.0.1:10005 check

backend be_ss
    mode tcp
    server ss 127.0.0.1:10007 check

backend be_sshws
    mode tcp
    server sshws 127.0.0.1:10020 check

backend be_nginx
    mode tcp
    server nginx 127.0.0.1:8080 check
